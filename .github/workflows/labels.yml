# Maakt de labels aan die het woordenboek gebruikt (veilig om vaker te draaien).
name: Labels aanmaken

on:
  push:
    paths: [.github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'nieuw-woord', color: '1d76db', description: 'Voorstel voor een nieuw woord' },
              { name: 'goedgekeurd', color: '0e8a16', description: 'Goedgekeurd: wordt automatisch toegevoegd' },
              { name: 'correctie', color: 'fbca04', description: 'Fout of verbetering bij een bestaand woord' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
                core.info(`Aangemaakt: ${l.name}`);
              } catch (e) {
                if (e.status !== 422) throw e;
                await github.rest.issues.updateLabel({ ...context.repo, ...l });
                core.info(`Bestond al, bijgewerkt: ${l.name}`);
              }
            }
